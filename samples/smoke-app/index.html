<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>REA smoke sample</title>
</head>
<body>
  <h1>REA smoke sample</h1>
  <button id="load">读取配置</button>
  <pre id="out"></pre>
  <script>
    document.getElementById('load').addEventListener('click', async () => {
      const text = await window.reaDemo.readConfig('settings');
      document.getElementById('out').textContent = text;
    });
  </script>
</body>
</html>
